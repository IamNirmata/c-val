[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cval"
version = "0.2.0"
description = "Continuous validation orchestration for GPU clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cval = "cval.cli:main"

[tool.setuptools.packages.find]
include = ["cval*"]

[tool.ruff]
line-length = 100
target-version = "py311"