[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cval"
version = "0.2.0"
description = "Continuous validation orchestration for GPU clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
postgresql = [
	"psycopg[binary]>=3.2,<4",
	"psycopg-pool>=3.2,<4",
]

[project.scripts]
cval = "cval.cli:main"

[tool.setuptools.packages.find]
include = ["cval*"]

[tool.setuptools.package-data]
"cval.nccl_eval" = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"