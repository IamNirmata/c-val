# c-val operator configuration.
# Global [tests.*] tables register/enable tests; benchmark settings stay in each test_config.toml.

[cluster]
namespace = "gcr-admin"
pvc_access_pod = "gcr-admin-pvc-access"
node_filter = "hgx"
tolerated_no_schedule_taints = ["nvidia.com/gpu", "rdma"]

[scheduling]
days_threshold = 7
batch_size = 4

[job]
template_path = "ymls/specific-node-job.yml"
job_prefix = "cval"
git_repo = "https://github.com/IamNirmata/c-val.git"
git_ref = "main"

[policy]
namespace_allowlist = ["gcr-admin"]
max_batch_size = 5
confirmation_phrase = "submit"

[monitoring]
# A full storage + NCCL + DL validation run takes well over 180s; give watch
# mode enough time for every sequential test deadline plus ingestion grace.
timeout_seconds = 6000
poll_interval_seconds = 60
pending_start_timeout_seconds = 480

[storage]
validation_db_path = "/data/continuous_validation/metadata/validation.db"
# U6 production writes remain disabled until backup/dry-run evidence and an
# exact activation/deployment command receive separate approval.
run_history_enabled = false
run_history_db_path = "/data/continuous_validation/metadata/node-run-history.db"
# U7 canonical per-test DB dual-writes are independently default-off. Enabling
# them requires the separate backup/dry-run/live-write approval gate.
per_test_ingestion_enabled = false
storage_db_path = "/data/continuous_validation/metadata/test-storage.db"
nccl_db_path = "/data/continuous_validation/metadata/test-nccl.db"
dl_numerical_db_path = "/data/continuous_validation/metadata/dltest_numerical_correctness.db"
dl_compute_db_path = "/data/continuous_validation/metadata/dltest_compute_performance.db"
dl_collective_db_path = "/data/continuous_validation/metadata/dltest_collective_performance.db"
dl_overlap_db_path = "/data/continuous_validation/metadata/dltest_overlap_performance.db"

[runtime]
repo_dir = "/workspace/c-val"
validation_root = "/data/continuous_validation"
validation_tests_dir = "/workspace/c-val/validation-tests"
dl_unit_test_dir = "/data/continuous_validation/deep-learning-unit-test-main"
dl_results_root_path = "/data/continuous_validation/validation_tests/dltest/runs"

# ---------------------------------------------------------------------------
# Validation phases. Set enabled=false to skip a phase in new validation jobs.
# Disabled phases are recorded as incomplete/enabled=false and do not ingest
# performance metrics. At least one phase must remain enabled.

[tests.storage]
enabled = true
config_path = "validation-tests/storage/test_config.toml"

[tests.nccl]
enabled = true
config_path = "validation-tests/nccl/test_config.toml"

[tests.dltest]
enabled = true
config_path = "validation-tests/dltest/test_config.toml"

[job_template]
# Kubernetes resources reserved by the validation pod. Keep gpu_count >= each
# enabled GPU test's gpu_count.
namespace = "gcr-admin"
queue = "gcr-admin"
app_label = "hari-gcr-bonete-test"
pvc_claim = "pvc-vast-gcr-admin"
container_image = "nvcr.io/nvidia/pytorch:26.05-py3"
shared_memory_size = "256Gi"
gpu_resource_name = "nvidia.com/gpu"
gpu_count = "8"
cpu = "100"
memory = "1500Gi"
rdma_resource_name = "rdma/rdma_shared_device_a"
rdma_count = "1"
rdma_toleration_key = "rdma"
gpu_toleration_key = "nvidia.com/gpu"

[baseline]
# Shared baseline lifecycle and cadence settings. Test-specific tolerances,
# combination factors, and aggregation settings live in each test_config.toml.
baseline_root_path = "/data/continuous_validation/baselines"
# Robust z-score cutoff for dynamic baselines (Iglewicz & Hoaglin: 3.5)
robust_z_threshold = 3.5
# Minimum clean samples before a metric baseline is trusted
min_samples = 8
# Rolling window (days) of recent runs used to build a baseline
window_days = 30
# Background builder loop cadence (daily)
build_interval_seconds = 86400
# Background classifier loop cadence
classify_interval_seconds = 300

[health_evaluator]
# U9 is an independent derived-write surface. Dry-run remains available while
# this gate is false; apply and activation additionally require exact CLI
# confirmation. Enabling this does not enable U6/U7 ingestion writes.
write_enabled = false
lock_timeout_seconds = 30
# U11 preflight requires this exact safe mode on runtime.validation_root; every
# existing descendant through each test-owned DB parent must be exact 0700.
validation_root_mode = "0700"
# Bounds only oldest-pending classification writes per cycle. Candidate source
# catalogs remain complete and cumulative for every current combination.
max_classifications_per_test = 250