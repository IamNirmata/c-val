# c-val default configuration.
#
# TOML is used because it is human-readable, supports comments and typed nested
# values, and is parsed by Python 3.11+ with stdlib `tomllib`.

[cluster]
namespace = "gcr-admin"
pvc_access_pod = "gcr-admin-pvc-access"
node_filter = "hgx"
tolerated_no_schedule_taints = ["nvidia.com/gpu", "rdma"]

[scheduling]
days_threshold = 7
batch_size = 4

[job]
template_path = "ymls/specific-node-job.yml"
job_prefix = "cval"
image_name = "pytorch:26.05-py3"
git_repo = "https://github.com/IamNirmata/c-val.git"
git_ref = "main"

[policy]
namespace_allowlist = ["gcr-admin"]
max_batch_size = 5
confirmation_phrase = "submit"

[monitoring]
# A full storage + NCCL + DL validation run takes well over 180s; give watch
# mode an hour by default before declaring a timeout.
timeout_seconds = 3600
poll_interval_seconds = 60
pending_start_timeout_seconds = 480

[storage]
validation_db_path = "/data/continuous_validation/metadata/validation.db"
storage_db_path = "/data/continuous_validation/metadata/test-storage.db"
nccl_db_path = "/data/continuous_validation/metadata/test-nccl.db"

[runtime]
repo_dir = "/workspace/c-val"
validation_root = "/data/continuous_validation"
validation_tests_dir = "/workspace/c-val/validation-tests"
dl_unit_test_dir = "/data/continuous_validation/deep-learning-unit-test-main"

[validation]
gpu_count = 8
nccl_iterations = 20
nccl_data_size_gb = 8
ibbw_start_device = 0
ibbw_end_device = 13
dl_test_plan = "80gb-example"
dl_baseline_test_id = "b200-pt2.8.0-cuda12.9"
dl_iterations = 20

[job_template]
namespace = "gcr-admin"
queue = "gcr-admin"
app_label = "hari-gcr-bonete-test"
pvc_claim = "pvc-vast-gcr-admin"
container_image = "nvcr.io/nvidia/pytorch:26.05-py3"
shared_memory_size = "256Gi"
gpu_resource_name = "nvidia.com/gpu"
gpu_count = "8"
cpu = "100"
memory = "1500Gi"
rdma_resource_name = "rdma/rdma_shared_device_a"
rdma_count = "1"
rdma_toleration_key = "rdma"
gpu_toleration_key = "nvidia.com/gpu"

[baseline]
# Tolerance values for baseline and peer-comparison classification.
# NCCL: compare against peer baseline with 5% tolerance
nccl_peer_tolerance_pct = 5.0
# Storage: compare against peer baseline with 10% tolerance
storage_peer_tolerance_pct = 10.0
# DL compute/collective tasks: tight baseline (3%)
dl_compute_tolerance_pct = 3.0
# DL numerical metrics: almost-exact (0.1%)
dl_numerical_tolerance_pct = 0.1
# DL overlap tasks: lenient baseline (20%) due to high variance
dl_overlap_tolerance_pct = 20.0
# Enable automatic outlier classification
classify_outliers = true