apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cval-evaluator-deny-all
  labels:
    app.kubernetes.io/name: cval-evaluator
    app.kubernetes.io/component: health-evaluator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cval-evaluator
      app.kubernetes.io/component: health-evaluator
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
