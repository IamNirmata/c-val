schema_version = "cval.test.v1"

[test]
id = "dltest"
display_name = "Deep-learning unit test"
description = "Numerical correctness, compute, collective, and overlap validation."
order = 30
entrypoint = "run-test.sh"
setup = "setup.sh"
timeout_seconds = 2400
continue_on_failure = true

[requirements]
cpu = "32"
memory = "128Gi"
gpu_count = 8
rdma_count = 0
shared_memory = "128Gi"
read_sysfs = false

[settings]
gpu_count = 8
test_plan = "80gb-example"
iterations = 100

[artifacts]
summary_filename = "summary.json"

[plugin]
adapter = "plugin.py"
api_version = "cval.plugin.v1"
capabilities = ["config", "export"]
