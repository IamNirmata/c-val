schema_version = "cval.test.v1"

[test]
id = "dltest"
display_name = "Deep-learning unit test"
description = "Numerical correctness, compute, collective, and overlap validation."
order = 30
entrypoint = "run-test.sh"
setup = "setup.sh"
timeout_seconds = 2400
continue_on_failure = true

[requirements]
cpu = "32"
memory = "128Gi"
gpu_count = 8
rdma_count = 0
shared_memory = "128Gi"
read_sysfs = false

[settings]
gpu_count = 8
test_plan = "80gb-example"
iterations = 100

[artifacts]
summary_filename = "summary.json"

[plugin]
adapter = "plugin.py"
api_version = "cval.plugin.v1"
capabilities = ["config", "export"]

[evaluation]
enabled = true
baseline_script = "baseline.py"
classification_script = "classification.py"
refresh_seconds = 1209600
window_seconds = 2419200
holdout_seconds = 86400
expires_seconds = 2419200
min_nodes = 30
quantile = 0.95
min_relative_gap = 0.05
min_mode_fraction = 0.9
atol = 0.000001
rtol = 0.01
expected_ranks = 8
require_hardware = true

[evaluation.metrics]
numerical_correctness = ["norm_output", "bias", "weight", "bias_hh_l0", "bias_ih_l0", "weight_hh_l0", "weight_ih_l0"]
compute_performance = ["fp_cpu_time", "fp_gpu_time", "bp_cpu_time", "bp_gpu_time"]
collective_performance = ["cpu_time", "gpu_time"]
overlap_performance = ["coll_mean", "coll_stdev", "layer_mean", "layer_stdev"]
