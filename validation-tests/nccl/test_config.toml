schema_version = "cval.test.v1"

[test]
id = "nccl"
display_name = "NCCL and HCA health"
description = "Single-node all-reduce and InfiniBand HCA transmit-bandwidth validation."
order = 20
entrypoint = "run-test.sh"
setup = "setup.sh"
timeout_seconds = 1200
continue_on_failure = true

[requirements]
cpu = "8"
memory = "32Gi"
gpu_count = 8
rdma_count = 1
shared_memory = "16Gi"
read_sysfs = true

[settings]
gpu_count = 8
iterations = 20
data_size_gb = 8
ibbw_enabled = true
net = "IB"
p2p_disable = true
shm_disable = true
debug = "INFO"

[artifacts]
summary_filename = "summary.json"

[plugin]
adapter = "plugin.py"
api_version = "cval.plugin.v1"
capabilities = ["config", "export"]
