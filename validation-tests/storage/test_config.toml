schema_version = "cval.test.v1"

[test]
id = "storage"
display_name = "Storage FIO"
description = "PVC/NFS storage correctness and performance validation."
order = 10
entrypoint = "run-test.sh"
setup = "setup.sh"
timeout_seconds = 1800
continue_on_failure = true

[requirements]
cpu = "1"
memory = "1Gi"
gpu_count = 0
rdma_count = 0
shared_memory = "0"
read_sysfs = false

[settings]
install_fio = true

[artifacts]
summary_filename = "summary.txt"

[plugin]
adapter = "plugin.py"
api_version = "cval.plugin.v1"
capabilities = ["config", "export"]

[evaluation]
enabled = true
baseline_script = "baseline.py"
classification_script = "classification.py"
refresh_seconds = 1209600
window_seconds = 2419200
holdout_seconds = 86400
expires_seconds = 2419200
min_nodes = 30
quantile = 0.95
min_relative_gap = 0.05
min_mode_fraction = 0.9
atol = 0.000001
rtol = 0.01
expected_ranks = 1
require_hardware = false

[evaluation.metrics]
storage = ["iodepth_read_1file_iops", "iodepth_read_1file_bw", "iodepth_write_1file_iops", "iodepth_write_1file_bw", "numjobs_read_nfiles_iops", "numjobs_read_nfiles_bw", "numjobs_write_nfiles_iops", "numjobs_write_nfiles_bw", "randread_iops", "randread_bw", "randwrite_iops", "randwrite_bw"]
