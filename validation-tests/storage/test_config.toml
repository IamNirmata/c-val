schema_version = "cval.test.v1"

[test]
id = "storage"
display_name = "Storage FIO"
description = "PVC/NFS storage correctness and performance validation."
order = 10
entrypoint = "run-test.sh"
setup = "setup.sh"
timeout_seconds = 1800
continue_on_failure = true

[requirements]
cpu = "1"
memory = "1Gi"
gpu_count = 0
rdma_count = 0
shared_memory = "0"
read_sysfs = false

[settings]
install_fio = true

[artifacts]
summary_filename = "summary.txt"

[plugin]
adapter = "plugin.py"
api_version = "cval.plugin.v1"
capabilities = ["config", "baseline", "export"]
