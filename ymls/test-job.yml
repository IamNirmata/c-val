apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: jobname-placeholder
  namespace: namespace-placeholder
spec:
  queue: queue-placeholder
  minAvailable: 1
  plugins:
    ssh: []
    svc: []
    env: []
  tasks:
    - name: server
      replicas: 1
      template:
        metadata:
          labels:
            app: app-label-placeholder
            role: server
        spec:
          schedulerName: volcano
          restartPolicy: Never
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: shared-memory-size-placeholder
            - name: sys
              hostPath:
                path: /sys
                type: Directory
            - name: data
              persistentVolumeClaim:
                claimName: pvc-claim-placeholder
          tolerations:
            - key: "rdma-toleration-key-placeholder"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "gpu-toleration-key-placeholder"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
            - name: server
              image: container-image-placeholder
              env:
                - name: GCRNODE
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: GCRTIME
                  value: "time-placeholder"
                - name: CVAL_RUN_ID
                  value: "$(GCRNODE)-time-placeholder"
                - name: GCRRESULT1
                  value: fail
                - name: GCRRESULT2
                  value: fail
                - name: GCRRESULT3
                  value: fail
                - name: CVAL_GIT_REPO
                  value: "git-repo-placeholder"
                - name: CVAL_GIT_REF
                  value: "git-ref-placeholder"
                - name: CVAL_IMAGE_NAME
                  value: "image-name-placeholder"
                - name: CVAL_REPO_DIR
                  value: "runtime-repo-dir-placeholder"
                - name: CVAL_VALIDATION_ROOT
                  value: "runtime-validation-root-placeholder"
                - name: CVAL_RUNTIME_ENV_B64
                  value: "runtime-environment-b64-placeholder"
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: sys
                  mountPath: /sys
                  readOnly: true
                - name: data
                  mountPath: /data
              ports:
                - name: rdma
                  containerPort: 18515
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  runtime-bootstrap-placeholder
              resources:
                requests:
                  gpu-resource-name-placeholder: "gpu-count-placeholder"
                  cpu: "cpu-placeholder"
                  memory: "memory-placeholder"
                  rdma-resource-name-placeholder: "rdma-count-placeholder"
                limits:
                  gpu-resource-name-placeholder: "gpu-count-placeholder"
                  cpu: "cpu-placeholder"
                  memory: "memory-placeholder"
                  rdma-resource-name-placeholder: "rdma-count-placeholder"