apiVersion: v1
kind: Pod
metadata:
  name: cval-controller
  namespace: gcr-admin
  labels:
    app: cval-controller
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  nodeSelector:
    k8s.lambda.ai/node-type: cpu
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: controller
      image: python:3.12@sha256:7ad6d21a25a94b2c00e685e82c2fd298de814353d9ee0e3f7f2cd4fca063df60
      imagePullPolicy: IfNotPresent
      workingDir: /data
      command: ["/bin/bash", "/bootstrap/env.sh"]
      env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: KUBECONFIG
          value: /data/continuous_validation/secrets/config
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: cval-controller
              key: github_pat
      resources:
        requests:
          cpu: "8"
          memory: 8Gi
          ephemeral-storage: 2Gi
        limits:
          memory: 8Gi
          ephemeral-storage: 8Gi
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
      readinessProbe:
        exec:
          command: ["tmux", "has-session", "-t", "cval-live"]
        initialDelaySeconds: 5
        periodSeconds: 30
        timeoutSeconds: 5
      volumeMounts:
        - name: data
          mountPath: /data
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-vast-gcr-admin
    - name: bootstrap
      configMap:
        name: cval-controller-env
        defaultMode: 0444