apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: gcr-admin-pvc-access
  namespace: gcr-admin
  labels:
    app.kubernetes.io/name: gcr-admin-pvc-access
    app.kubernetes.io/part-of: c-val
spec:
  schedulerName: volcano
  queue: gcr-admin
  minAvailable: 1
  tasks:
    - replicas: 1
      name: server
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gcr-admin-pvc-access
            app.kubernetes.io/part-of: c-val
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: server
              image: python:3.12
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  python3 --version
                  python3 - <<'PY'
                  import sqlite3
                  print("sqlite", sqlite3.sqlite_version)
                  PY
                  echo "c-val PVC access pod ready"
                  exec /bin/sleep infinity
              resources:
                requests:
                  cpu: "2"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pvc-vast-gcr-admin