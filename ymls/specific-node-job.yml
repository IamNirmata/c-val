apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  # Renderer replaces this placeholder with a deterministic job name.
  generateName: jobname-placeholder
  namespace: namespace-placeholder
spec:
  queue: queue-placeholder
  minAvailable: 1
  plugins:
    ssh: []
    svc: []
    env: []
  tasks:
    - name: server
      replicas: 1
      template:
        metadata:
          labels:
            app: app-label-placeholder
            role: server
        spec:
          schedulerName: volcano
          nodeSelector:
            # c-val deliberately pins one job to one discovered free node.
            kubernetes.io/hostname: "nodename-placeholder"
          restartPolicy: Never
          volumes:
            - name: dshm
              emptyDir:
                # Large /dev/shm is required by NCCL and DL workloads.
                medium: Memory
                sizeLimit: shared-memory-size-placeholder
            - name: sys
              hostPath:
                path: /sys
                type: Directory
            - name: data
              persistentVolumeClaim:
                claimName: pvc-claim-placeholder
          tolerations:
            # Discovery filters non-tolerated NoSchedule taints before rendering.
            # Allow validation to run on a cordoned (suspected-unhealthy) node:
            # kubectl cordon adds this taint, which normal workloads do not tolerate.
            - key: "node.kubernetes.io/unschedulable"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "rdma-toleration-key-placeholder"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "gpu-toleration-key-placeholder"
              operator: "Exists"
              effect: "NoSchedule"
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: app-label-placeholder
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: server
              image: container-image-placeholder
              env:
                - name: GCRNODE
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: GCRTIME
                  value: "time-placeholder"
                - name: CVAL_RUN_ID
                  value: "nodename-placeholder-time-placeholder"
                - name: GCRRESULT1
                  value: fail
                - name: GCRRESULT2
                  value: fail
                - name: GCRRESULT3
                  value: fail
                - name: CVAL_GIT_REPO
                  value: "git-repo-placeholder"
                - name: CVAL_GIT_REF
                  # Pin the runtime checkout to a commit/tag instead of moving main.
                  value: "git-ref-placeholder"
                - name: CVAL_IMAGE_NAME
                  value: "image-name-placeholder"
                - name: CVAL_REPO_DIR
                  value: "runtime-repo-dir-placeholder"
                - name: CVAL_VALIDATION_ROOT
                  value: "runtime-validation-root-placeholder"
                - name: CVAL_RUNTIME_ENV_B64
                  # Registry plus current v1 compatibility exports. Base64 keeps
                  # test settings out of this Kubernetes manifest structure.
                  value: "runtime-environment-b64-placeholder"
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: sys
                  mountPath: /sys
                  readOnly: true
                - name: data
                  mountPath: /data
              ports:
                - name: rdma
                  containerPort: 18515
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  # The job clones c-val inside the container so the runtime code
                  # matches the explicitly supplied CVAL_GIT_REF.
                  git clone "$CVAL_GIT_REPO" "$CVAL_REPO_DIR"
                  cd "$CVAL_REPO_DIR"
                  git fetch --all --tags
                  git checkout "$CVAL_GIT_REF"
                  # Decode a renderer-generated, shell-quoted export file. It is
                  # data only: operators cannot supply arbitrary shell text.
                  printf '%s' "$CVAL_RUNTIME_ENV_B64" | base64 -d > /tmp/cval-runtime.env
                  source /tmp/cval-runtime.env
                  # One Python parent reserves every canonical evidence directory
                  # and global file through retained openat descriptors, then
                  # supervises the generic runner and compatibility ingestion.
                  exec python3 -m cval.validation.supervisor
              resources:
                requests:
                  gpu-resource-name-placeholder: "gpu-count-placeholder"
                  cpu: "cpu-placeholder"
                  memory: "memory-placeholder"
                  rdma-resource-name-placeholder: "rdma-count-placeholder"
                limits:
                  gpu-resource-name-placeholder: "gpu-count-placeholder"
                  cpu: "cpu-placeholder"
                  memory: "memory-placeholder"
                  rdma-resource-name-placeholder: "rdma-count-placeholder"